<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="command-token" content="__COMMAND_TOKEN__">
<title>Vibe Command Center</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0f0f12;
    --surface: #17171b;
    --surface-raised: #1f1f25;
    --surface-sunken: #0a0a0c;
    --line: #2a2a32;
    --line-strong: #70707b;
    --text: #ececf1;
    --text-muted: #a1a1aa;
    --text-faint: #85858f;
    --mid: #2a2640;
    --mid-line: #4a4273;
    --mid-text: #c3baf0;
    --neon-violet: #aa89fc;
    --neon-magenta: #ff7ad9;
    --neon-azure: #67aafe;
    --neon-cyan: #4fd8eb;
    --neon-lime: #b6f23c;
    --accent: var(--neon-azure);
    --accent-tint: #14233a;
    --on-accent: #0f172a;
    --good: #34d3a6;
    --good-tint: #0f2a22;
    --warn: #fbbf24;
    --warn-tint: #2c2210;
    --bad: #ff7a8a;
    --bad-tint: #30151b;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      color-scheme: light;
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-raised: #ffffff;
      --surface-sunken: #f1f1f3;
      --line: #e4e4e7;
      --line-strong: #85858f;
      --text: #18181b;
      --text-muted: #52525b;
      --text-faint: #6b6b76;
      --mid: #eceaf8;
      --mid-line: #cdc7ec;
      --mid-text: #453a8f;
      --neon-violet: #7433cb;
      --neon-magenta: #b0188a;
      --neon-azure: #0063cd;
      --neon-cyan: #0b7285;
      --neon-lime: #4d7c0f;
      --accent: var(--neon-azure);
      --accent-tint: #edf4fe;
      --on-accent: #ffffff;
      --good: #0b7a5c;
      --good-tint: #e4f6ef;
      --warn: #8a4b08;
      --warn-tint: #fdf2d5;
      --bad: #c01540;
      --bad-tint: #fde7eb;
    }
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #fafafa;
    --surface: #ffffff;
    --surface-raised: #ffffff;
    --surface-sunken: #f1f1f3;
    --line: #e4e4e7;
    --line-strong: #85858f;
    --text: #18181b;
    --text-muted: #52525b;
    --text-faint: #6b6b76;
    --mid: #eceaf8;
    --mid-line: #cdc7ec;
    --mid-text: #453a8f;
    --neon-violet: #7433cb;
    --neon-magenta: #b0188a;
    --neon-azure: #0063cd;
    --neon-cyan: #0b7285;
    --neon-lime: #4d7c0f;
    --accent: var(--neon-azure);
    --accent-tint: #edf4fe;
    --on-accent: #ffffff;
    --good: #0b7a5c;
    --good-tint: #e4f6ef;
    --warn: #8a4b08;
    --warn-tint: #fdf2d5;
    --bad: #c01540;
    --bad-tint: #fde7eb;
  }
  [data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f0f12;
    --surface: #17171b;
    --surface-raised: #1f1f25;
    --surface-sunken: #0a0a0c;
    --line: #2a2a32;
    --line-strong: #70707b;
    --text: #ececf1;
    --text-muted: #a1a1aa;
    --text-faint: #85858f;
    --mid: #2a2640;
    --mid-line: #4a4273;
    --mid-text: #c3baf0;
    --neon-violet: #aa89fc;
    --neon-magenta: #ff7ad9;
    --neon-azure: #67aafe;
    --neon-cyan: #4fd8eb;
    --neon-lime: #b6f23c;
    --accent: var(--neon-azure);
    --accent-tint: #14233a;
    --on-accent: #0f172a;
    --good: #34d3a6;
    --good-tint: #0f2a22;
    --warn: #fbbf24;
    --warn-tint: #2c2210;
    --bad: #ff7a8a;
    --bad-tint: #30151b;
  }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 system-ui, -apple-system, sans-serif; }
  header { padding:12px 16px; border-bottom:1px solid var(--line); background:var(--surface); }
  h1 { font-size:16px; margin:0 0 8px; }
  .strip { display:flex; flex-wrap:wrap; gap:8px; font-size:12px; color:var(--text-muted); }
  .pill { border:1px solid var(--line); border-radius:999px; padding:2px 8px; }
  main { display:grid; grid-template-columns:repeat(6, minmax(180px, 1fr)); gap:10px; padding:12px 16px; overflow-x:auto; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin:4px 0 8px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:10px; margin-bottom:8px; }
  .card.stale { border-color:var(--warn); }
  .row { display:flex; justify-content:space-between; gap:6px; align-items:center; flex-wrap:wrap; }
  .title { font-weight:600; word-break:break-word; }
  .muted { color:var(--text-muted); font-size:12px; word-break:break-word; }
  .badge { font-size:11px; border-radius:4px; padding:2px 6px; background:var(--surface-sunken); border:1px solid var(--line); }
  .badge.evidence { background:var(--warn-tint); color:var(--warn); border-color:transparent; font-weight:600; }
  .badge.stale { background:var(--warn-tint); color:var(--warn); border-color:transparent; }
  .herdr-Working { color:var(--good); } .herdr-Blocked { color:var(--bad); } .herdr-Idle { color:var(--accent); } .herdr-Offline { color:var(--text-muted); }
  button { font:inherit; font-size:12px; border:1px solid var(--line); background:var(--surface-raised); color:var(--text); border-radius:6px; padding:4px 8px; cursor:pointer; margin-top:6px; }
  button.primary { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #msg { padding:0 16px; font-size:12px; color:var(--text-muted); min-height:18px; }
  @media (max-width: 900px) { main { grid-template-columns:repeat(6, 200px); } }
</style>
</head>
<body>
<header>
  <h1>Vibe Coding Command Center</h1>
  <div class="strip" id="strip">Connecting...</div>
</header>
<div id="msg"></div>
<main id="board"></main>
<script>
(function () {
  "use strict";
  var TOKEN = document.querySelector('meta[name="command-token"]').content;
  var STAGES = ["Design", "Falcon-Review", "Implementation", "Claimed", "Verified", "Accepted"];
  var board = document.getElementById("board");
  var strip = document.getElementById("strip");
  var msg = document.getElementById("msg");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }

  function api(path, opts) {
    opts = opts || {};
    var headers = { "X-Command-Token": TOKEN };
    if (opts.body) headers["Content-Type"] = "application/json";
    return fetch(path, { method: opts.method || "GET", headers: headers, body: opts.body ? JSON.stringify(opts.body) : undefined })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, body: j }; }); });
  }

  function renderStrip(snap) {
    strip.textContent = "";
    var counts = { Working: 0, Blocked: 0, Idle: 0, Offline: 0 };
    var pending = 0, stale = 0;
    snap.cards.forEach(function (c) { counts[c.herdr] = (counts[c.herdr] || 0) + 1; pending += c.pendingDecisions; if (c.stale) stale++; });
    [["Working", counts.Working], ["Blocked", counts.Blocked], ["Idle", counts.Idle], ["Offline", counts.Offline]].forEach(function (p) {
      strip.appendChild(el("span", "pill herdr-" + p[0], "Herdr " + p[0] + ": " + p[1]));
    });
    strip.appendChild(el("span", "pill", "Pending decisions: " + pending));
    strip.appendChild(el("span", "pill", "Stale: " + stale));
    strip.appendChild(el("span", "pill", "Updated " + new Date(snap.generatedAt).toLocaleTimeString()));
  }

  function card(c) {
    var box = el("div", "card" + (c.stale ? " stale" : ""));
    var top = el("div", "row");
    top.appendChild(el("span", "muted", c.repo));
    top.appendChild(el("span", "badge", c.rawStage || "unknown"));
    box.appendChild(top);
    box.appendChild(el("div", "title", c.sliceId ? (c.sliceId + ": " + (c.sliceTitle || "")) : (c.currentIntent || c.worktreeId)));
    if (c.activeSlice) box.appendChild(el("div", "muted", "slice " + c.activeSlice.id + (c.activeSlice.title ? ": " + c.activeSlice.title : "")));
    box.appendChild(el("div", "muted", "branch: " + (c.branch || "?") + " · HEAD " + (c.currentHeadSha || "?")));
    var flags = el("div", "row");
    flags.appendChild(el("span", "herdr-" + c.herdr, "Herdr: " + c.herdr));
    flags.appendChild(el("span", "muted", "decisions: " + c.pendingDecisions));
    box.appendChild(flags);
    if (c.badge) box.appendChild(el("div", "badge evidence", c.badge));
    if (c.staleLabel) box.appendChild(el("div", "badge stale", c.staleLabel));
    if (c.canAccept) {
      var b = el("button", "primary", "Accept Verified Slice");
      b.addEventListener("click", function () { accept(c.worktree, b); });
      box.appendChild(b);
    }
    if (c.herdrAgentId) {
      var f = el("button", "", "Focus pane");
      f.addEventListener("click", function () { focusAgent(c.worktreeId, c.herdrAgentId); });
      box.appendChild(f);
    }
    return box;
  }

  function render(snap) {
    renderStrip(snap);
    board.textContent = "";
    STAGES.forEach(function (stage) {
      var col = el("section", "col");
      col.appendChild(el("h2", "", stage));
      snap.cards.filter(function (c) { return c.stage === stage; }).forEach(function (c) { col.appendChild(card(c)); });
      board.appendChild(col);
    });
  }

  function accept(worktree, button) {
    button.disabled = true;
    api("/api/slice/accept", { method: "POST", body: { worktree: worktree } }).then(function (r) {
      msg.textContent = r.ok ? "Slice accepted." : "Not accepted: " + ((r.body && r.body.error) || r.status);
    }).catch(function () { msg.textContent = "Accept request failed."; });
  }

  function focusAgent(worktreeId, paneId) {
    api("/api/herdr/focus", { method: "POST", body: { action: "focus", worktreeId: worktreeId, paneId: paneId } }).then(function (r) {
      msg.textContent = r.ok ? "Focused pane." : "Focus failed: " + ((r.body && r.body.error) || r.status);
    });
  }

  // Live updates over fetch streaming (EventSource cannot send the token header).
  function connect() {
    fetch("/api/events", { headers: { "X-Command-Token": TOKEN } }).then(function (res) {
      if (!res.ok) { strip.textContent = "Rejected (" + res.status + ")"; return; }
      var reader = res.body.getReader();
      var decoder = new TextDecoder();
      var buf = "";
      function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) { setTimeout(connect, 3000); return; }
          buf += decoder.decode(chunk.value, { stream: true });
          var parts = buf.split("\n\n");
          buf = parts.pop();
          parts.forEach(function (block) {
            var data = block.split("\n").filter(function (l) { return l.indexOf("data: ") === 0; }).map(function (l) { return l.slice(6); }).join("\n");
            if (data) { try { render(JSON.parse(data)); } catch (e) { /* ignore bad frame */ } }
          });
          return pump();
        });
      }
      return pump();
    }).catch(function () { setTimeout(connect, 3000); });
  }

  connect();
})();
</script>
</body>
</html>
