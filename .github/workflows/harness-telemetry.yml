# Baseline telemetry (slice 19.3). When a pull request merges, its harness receipt is read from the PR body
# and appended as one JSONL line to the harness-telemetry branch of the calling repo, at telemetry/<repo>.jsonl.
# Spokes call this workflow at @main. The caller grants contents: write.
name: harness-telemetry

on:
  pull_request:
    types: [closed]
  workflow_call:

concurrency:
  group: harness-telemetry
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the hub receipt script
        uses: actions/checkout@v4
        with:
          repository: cchonguyen/claude-harness-hub
          ref: main
          path: .harness-hub
          persist-credentials: false

      - name: Prepare the harness-telemetry branch
        env:
          REPO_FULL: ${{ github.repository }}
          GH_TOKEN_VALUE: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir telemetry
          cd telemetry
          git init -q
          git remote add origin "https://github.com/${REPO_FULL}.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN_VALUE" | base64 | tr -d '\n')
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic ${auth}"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin harness-telemetry >/dev/null 2>&1; then
            git fetch -q origin harness-telemetry
            git checkout -q -B harness-telemetry FETCH_HEAD
          else
            git checkout -q --orphan harness-telemetry
          fi

      - name: Write the PR body and PR context to temp files
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_MERGED_AT: ${{ github.event.pull_request.merged_at }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          jq -n \
            --argjson number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg mergedAt "$PR_MERGED_AT" \
            --arg headSha "$PR_HEAD_SHA" \
            --arg author "$PR_AUTHOR" \
            --argjson labels "$PR_LABELS_JSON" \
            '{number: $number, title: $title, mergedAt: $mergedAt, labels: $labels, headSha: $headSha, author: $author}' \
            > "$RUNNER_TEMP/pr.json"

      - name: Append the receipt record
        env:
          REPO_FULL: ${{ github.repository }}
        run: |
          set -euo pipefail
          repo_name="${REPO_FULL#*/}"
          mkdir -p telemetry/telemetry
          node .harness-hub/.harness/scripts/receipt.mjs record \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --pr-json "$RUNNER_TEMP/pr.json" \
            --repo "$REPO_FULL" \
            --out-append "telemetry/telemetry/${repo_name}.jsonl"

      - name: Commit and push with up to 3 rebase retries
        env:
          REPO_FULL: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          repo_name="${REPO_FULL#*/}"
          cd telemetry
          mkdir -p telemetry
          if [ ! -f telemetry/.gitattributes ]; then
            printf '*.jsonl merge=union\n' > telemetry/.gitattributes
          fi
          git add telemetry
          if git diff --cached --quiet; then
            echo "No new telemetry to record."
            exit 0
          fi
          git commit -q -m "telemetry: record PR #${PR_NUMBER} for ${repo_name}"
          for attempt in 1 2 3; do
            if git push -q origin HEAD:refs/heads/harness-telemetry; then
              echo "Pushed telemetry record (attempt ${attempt})."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto origin/harness-telemetry."
            git fetch -q origin harness-telemetry
            if ! git rebase -q FETCH_HEAD; then
              git rebase --abort || true
            fi
          done
          echo "Telemetry push failed after 3 attempts." >&2
          exit 1
