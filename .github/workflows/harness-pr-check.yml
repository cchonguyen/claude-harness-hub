name: Harness PR check

# The hub's own PR check. It runs the same checks the spoke template runs, plus the
# branch-up-to-date check and the build, so a hub PR is gated the way a spoke PR is.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pr-check:
    name: pr-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the PR branch tip, not GitHub's synthetic merge commit
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify branch is up-to-date with base branch
        run: |
          git fetch origin ${{ github.base_ref }}
          if ! git merge-base --is-ancestor origin/${{ github.base_ref }} HEAD; then
            echo "::error::Branch is behind ${{ github.base_ref }}. Run 'git fetch origin ${{ github.base_ref }} && git rebase origin/${{ github.base_ref }}' before merging."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Harness tests
        run: node --test plugins/harness/test/run.test.mjs .harness/hooks/lib/*.test.mjs .harness/scripts/*.test.mjs .harness/scripts/lib/*.test.mjs

      - name: Typecheck
        run: npm run typecheck --silent

      - name: Lint
        run: npm run lint --silent

      - name: Build check
        run: npm run build --if-present

      # Scope, red tripwires and test-assertion audit. Advisory, so it reports without blocking.
      - name: PR scope check
        continue-on-error: true
        run: node .harness/scripts/pr-scope-check.mjs origin/${{ github.base_ref }} HEAD
