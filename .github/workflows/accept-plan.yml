name: Accept plan

on:
  push:
    branches: [main]
    paths: ['.spec/plans/*.md']

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate slices listed in changed plan files
        run: |
          files=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- '.spec/plans/*.md' | grep -v README.md || true)
          if [ -z "$files" ]; then
            echo "No plan files added or changed by this push." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            node .harness/scripts/accept-plan.mjs --check "$f" >> "$GITHUB_STEP_SUMMARY" || status=1
          done <<< "$files"
          exit $status
