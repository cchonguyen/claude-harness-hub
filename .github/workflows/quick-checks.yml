name: Quick checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # main has no package-lock.json (dropped in cf25c7c), so npm ci cannot run here
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck --silent

      - name: Lint
        run: npm run lint --silent

      - name: Unit tests
        run: node --test .harness/hooks/lib/runner-matcher.test.mjs
