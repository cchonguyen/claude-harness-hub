# Automerge (harness:automerge label)
#
# Threads add the `harness:automerge` label to a pull request. This workflow
# waits for the PR checks, then merges with the built-in GITHUB_TOKEN so the
# merge record shows github-actions[bot].
#
# GITHUB_TOKEN merges do not fire push workflows, so the status snapshot is
# dispatched explicitly after the merge.

name: Automerge (harness:automerge label)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: github.event.label.name == 'harness:automerge' && github.event.pull_request.draft == false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR: ${{ github.event.pull_request.number }}
      REPO: ${{ github.repository }}
    steps:
      - name: Check PR state
        id: state
        run: |
          state=$(gh pr view "$PR" --repo "$REPO" --json state --jq .state)
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Wait for checks
        if: steps.state.outputs.state == 'OPEN'
        # Skip this job's own check run. `gh pr checks --watch` would wait on it
        # while it is still running, which never ends.
        run: |
          for attempt in $(seq 1 90); do
            # gh exits 8 while checks are pending and 1 on failures, but still prints the JSON.
            # Keep the output whatever the exit code, and leave stderr visible.
            checks=$(gh pr checks "$PR" --repo "$REPO" --json name,bucket || true)
            [ -n "$checks" ] || checks='[]'
            others=$(echo "$checks" | jq '[.[] | select(.name != "automerge" and (.name | endswith(" / automerge") | not))]')
            if [ "$(echo "$others" | jq '[.[] | select(.bucket == "fail" or .bucket == "cancel")] | length')" -gt 0 ]; then
              echo "A check failed; not merging."
              echo "$others" | jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | .name'
              exit 1
            fi
            if [ "$(echo "$others" | jq '[.[] | select(.bucket == "pending")] | length')" -eq 0 ] && [ "$(echo "$others" | jq 'length')" -gt 0 ]; then
              echo "All other checks passed."
              exit 0
            fi
            sleep 20
          done
          echo "Timed out waiting for checks."
          exit 1

      - name: Merge PR
        if: steps.state.outputs.state == 'OPEN'
        run: gh pr merge "$PR" --repo "$REPO" --squash

      - name: Dispatch status snapshot
        if: steps.state.outputs.state == 'OPEN'
        run: gh workflow run status-snapshot.yml --repo "$REPO" --ref main
