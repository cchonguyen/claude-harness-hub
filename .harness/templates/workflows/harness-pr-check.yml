# Harness PR check (spoke template). Copy to .github/workflows/harness-pr-check.yml in a spoke.
# Blocking: the PR shows red when the scope check or a quick check fails. Free GitHub plan, so no branch protection.
name: Harness PR check

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Scope, Red tripwires, and test-assertion rule. --strict makes problems exit 1.
      - name: PR scope check
        run: node .harness/scripts/pr-scope-check.mjs origin/${{ github.base_ref }} HEAD --strict

      # Quick checks from the spoke's CLAUDE.md. Delete any line the spoke has no tool for.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck --silent

      - name: Lint
        run: npm run lint --silent

      - name: Unit tests
        run: npm test --silent
